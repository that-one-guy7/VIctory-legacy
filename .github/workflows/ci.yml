name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      # The version and components pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Clippy, diagnostics build
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # Includes xtask's repository_passes_policy, the asset-policy check.
      # D3D12/WARP tests share GPU state; parallel test threads can cause driver access violations.
      - name: Tests
        run: cargo test --workspace --locked -- --test-threads=1
      # Exercise the real pinned NuGet download, SHA-512 check, extraction,
      # app-local layout, and executable exports on the Windows runner.
      - name: Stage D3D12 Agility SDK
        run: cargo xtask agility --target-dir target
      - name: Build release executable
        run: cargo build --release -p victory --locked
      - name: Verify Agility runtime, executable exports, and launcher syntax
        shell: pwsh
        run: |
          $runtime = "target\release\D3D12"
          foreach ($file in @("D3D12Core.dll", "d3d12SDKLayers.dll", "VICTORY_AGILITY_SDK_VERSION")) {
            if (!(Test-Path -LiteralPath (Join-Path $runtime $file) -PathType Leaf)) {
              throw "Agility SDK staging did not produce $runtime\$file"
            }
          }
          $sdkVersion = (Get-Content -LiteralPath (Join-Path $runtime "VICTORY_AGILITY_SDK_VERSION") -Raw).Trim()
          if ($sdkVersion -ne "1.620.2") {
            throw "Unexpected staged Agility SDK version: $sdkVersion"
          }

          $tokens = $null
          $parseErrors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts\play.ps1"),
            [ref]$tokens,
            [ref]$parseErrors
          )
          if ($parseErrors.Count -gt 0) {
            throw ($parseErrors | Out-String)
          }

          # Keep the launcher report useful as new switches are added, and
          # ensure it does not regress to dumping the entire process environment.
          $launcher = Get-Content -LiteralPath "scripts\play.ps1" -Raw
          foreach ($required in @(
            "VICTORY_*",
            "GetEnvironmentVariables",
            "Win32_OperatingSystem",
            "Win32_Processor",
            "Win32_VideoController",
            "agility_sdk_expected",
            "exit_code=",
            'VICTORY_D3D12_DEBUG = "1"',
            'VICTORY_WINDOW_KB = "1024"',
            'VICTORY_MESH_SHARED_SPARE_MB = "32"',
            'VICTORY_DSTORAGE_WORKERS = "3"',
            'VICTORY_PIPELINE_WORKERS = "2"',
            'VICTORY_EXPERIMENTAL_FSPX = "0"',
            '$env:VICTORY_EXPERIMENTAL_FSPX -eq "1"',
            '$UseGpuOverlap = ($env:VICTORY_GPU_OVERLAP -eq "1")',
            '$env:VICTORY_LATE_WAIT = "0"',
            '$env:VICTORY_RELAY = "0"',
            'VICTORY_LATE_WAIT = "3"',
            'VICTORY_LATE_WAIT_LISTS = "64"',
            'VICTORY_RELAY = "2"',
            '$UseLowVramProfile = ($env:VICTORY_MESH_FALLBACK -eq "1") -or ($ProfileName -eq "diag")',
            "low_vram_profile=",
            'VICTORY_D3D12_DRED = "1"'
          )) {
            if ($launcher -notmatch [regex]::Escape($required)) {
              throw "Launcher diagnostic report is missing required field or behavior: $required"
            }
          }
          if ($launcher -match "GetEnvironmentVariables\(\s*\)") {
            throw "Launcher must not dump the complete process environment"
          }

          $dumpbin = Get-Command dumpbin.exe -ErrorAction SilentlyContinue
          if (!$dumpbin) {
            $vswhere = Join-Path "${env:ProgramFiles(x86)}" "Microsoft Visual Studio\Installer\vswhere.exe"
            if (!(Test-Path -LiteralPath $vswhere)) {
              throw "Cannot locate vswhere.exe to verify victory.exe exports"
            }
            $vs = & $vswhere -latest -products "*" -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
            if ($LASTEXITCODE -ne 0 -or !$vs) {
              throw "Cannot locate the Visual Studio C++ tools"
            }
            $dumpbinFile = Get-ChildItem -LiteralPath (Join-Path $vs "VC\Tools\MSVC") -Filter dumpbin.exe -Recurse |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (!$dumpbinFile) {
              throw "dumpbin.exe was not found in the Visual Studio C++ tools"
            }
            $dumpbinPath = $dumpbinFile.FullName
          } else {
            $dumpbinPath = $dumpbin.Source
          }
          $exports = (& $dumpbinPath /exports "target\release\victory.exe" 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) {
            throw "dumpbin could not read target\release\victory.exe"
          }
          foreach ($symbol in @("D3D12SDKVersion", "D3D12SDKPath")) {
            if ($exports -notmatch [regex]::Escape($symbol)) {
              throw "victory.exe does not export required Agility symbol $symbol"
            }
          }
          Write-Host "Verified Agility SDK 1.620.2 files, both executable exports, and PowerShell launcher syntax."
